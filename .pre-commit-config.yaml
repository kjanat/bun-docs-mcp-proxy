---
minimum_pre_commit_version: "4.6.2"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
        stages: [pre-commit]

  - repo: https://github.com/trim21/dprint-pre-commit
    rev: v0.56.1.0
    hooks:
      - id: dprint
        stages: [pre-commit]

  - repo: https://github.com/tombi-toml/tombi-pre-commit
    rev: v1.4.1
    hooks:
      - id: tombi-lint
        args: [--offline]
        stages: [pre-commit]

  - repo: https://github.com/kjanat/actionlint
    rev: v1.13.0
    hooks:
      - id: actionlint
        stages: [pre-commit]

  - repo: https://github.com/AndrejOrsula/pre-commit-cargo
    rev: 0.5.0
    hooks:
      - id: cargo-check
        args: [--all-features, --all-targets]
        stages: [pre-commit]
      - id: cargo-test
        stages: [pre-push]
      - id: cargo-clippy
        args: [--all-features, --all-targets, --, -D, warnings]
        stages: [pre-push]
