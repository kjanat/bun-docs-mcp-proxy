name: Rust setup
description: Install Rust toolchain, cache, and optional tools.
inputs:
  toolchain:
    description: Rust toolchain to install.
    required: false
    default: stable
  components:
    description: Comma-separated rustup components (e.g. rustfmt, clippy).
    required: false
    default: ""
  targets:
    description: Comma-separated rustup targets.
    required: false
    default: ""
  cache-key:
    description: Optional rust-cache key.
    required: false
    default: ""
  install-just:
    description: Install just.
    required: false
    default: "true"
  install-nextest:
    description: Install cargo-nextest.
    required: false
    default: "false"
  install-llvm-cov:
    description: Install cargo-llvm-cov.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Cache
      if: ${{ inputs.cache-key == '' }}
      uses: Swatinem/rust-cache@v2

    - name: Cache (keyed)
      if: ${{ inputs.cache-key != '' }}
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}

    - name: Install just
      if: ${{ inputs.install-just == 'true' }}
      uses: extractions/setup-just@v4

    - name: Install cargo-nextest
      if: ${{ inputs.install-nextest == 'true' }}
      uses: taiki-e/install-action@nextest

    - name: Install cargo-llvm-cov
      if: ${{ inputs.install-llvm-cov == 'true' }}
      uses: taiki-e/install-action@cargo-llvm-cov
