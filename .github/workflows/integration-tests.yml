# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Integration Tests
on:
  schedule: [{ cron: "0 3 * * *" }] # Run daily at 3 AM UTC
  workflow_dispatch: # Allow manual trigger
    inputs: { verbose: { description: "Enable verbose output", required: false, default: false, type: boolean } }
env: { CARGO_TERM_COLOR: always, RUSTFLAGS: "-D warnings" }
jobs:
  integration-tests:
    name: Integration Tests (Real API)
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env: { RUST_LOG: "${{ github.event.inputs.verbose == 'true' && 'debug' || 'info' }}" }
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with: { install-nextest: "true", install-llvm-cov: "true", install-just: "false" }

      - name: Run integration tests with nextest
        run: |
          echo "::group::Running integration tests with nextest"
          cargo nextest run --features integration-tests --all-targets --profile ci --run-ignored all
          echo "::endgroup::"
        continue-on-error: true

      - name: Generate coverage for integration tests
        run: |
          echo "::group::Generating coverage for integration tests"
          cargo llvm-cov --features integration-tests --codecov --output-path integration-coverage.json -- --include-ignored
          echo "::endgroup::"
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: always()
        with: { files: integration-coverage.json, flags: integration, fail_ci_if_error: false }

      - name: Upload test results
        uses: codecov/codecov-action@v7
        if: always()
        with: { report_type: test_results, flags: integration, files: target/nextest/ci/junit.xml }
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          {
            echo "## Integration Test Summary"
            echo ""
            echo "Integration tests against live Bun API completed."
            echo "Note: Failures may be due to network issues or API changes."
            echo ""
            echo "To run locally: \`cargo test --features integration-tests\`"
          } >> "$GITHUB_STEP_SUMMARY"
