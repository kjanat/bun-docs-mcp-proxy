# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: Release

on:
  push: { tags: ["v*.*.*"] }
  workflow_dispatch:
    inputs:
      tag: { description: "Tag to release (e.g., v1.2.3)", required: false, type: string }
      draft: { description: "Create as a draft", required: false, default: false, type: boolean }
      prerelease: { description: "Mark as prerelease", required: false, default: false, type: boolean }
concurrency: { group: "release-${{ github.ref }}", cancel-in-progress: false }
env: { CARGO_TERM_COLOR: always, RUSTFLAGS: "-D warnings" }
defaults: { run: { shell: bash } }
jobs:
  define-matrix:
    name: Define Build Matrix
    runs-on: ubuntu-latest
    outputs: { platforms: "${{ steps.matrix.outputs.platforms }}" }
    permissions: { contents: read }
    steps:
      - name: Build matrix JSON
        id: matrix
        uses: actions/github-script@v8
        with:
          script: |
            const arches = ["aarch64", "x86_64"];
            const libcs = ["gnu", "musl"];

            const mk = (os, name, target, label) => {
              const win = os[0] === "w";
              return {
                os,
                name,
                target,
                label,
                archive_ext: win ? "zip" : "tar.gz",
                bin_ext: win ? ".exe" : "",
                cross: os[0] === "u" && (target.includes("aarch64") || target.includes("musl")),
              };
            };

            const label = (fam, arch, libc) =>
              fam === "macos"
                ? (arch === "x86_64" ? "macOS Intel" : "macOS Apple Silicon")
                : fam === "windows"
                ? `Windows ${arch === "aarch64" ? "ARM64" : "x86_64"}`
                : `Linux ${arch === "aarch64" ? "ARM64" : "x86_64"}${libc === "musl" ? " musl (static)" : ""}`;

            const platforms = [
              mk("macos-15-intel", "macos-x86_64", "x86_64-apple-darwin", label("macos", "x86_64")),
              mk("macos-latest", "macos-aarch64", "aarch64-apple-darwin", label("macos", "aarch64")),

              ...arches.flatMap(a =>
                libcs.map(l =>
                  mk("ubuntu-latest", `linux-${a}${l === "musl" ? "-musl" : ""}`, `${a}-unknown-linux-${l}`, label("linux", a, l))
                )
              ),

              ...arches.map(a => mk("windows-latest", `windows-${a}`, `${a}-pc-windows-msvc`, label("windows", a))),
            ];

            core.info(`Defined platforms: ${JSON.stringify(platforms)}`);
            core.setOutput("platforms", JSON.stringify(platforms));
  lint:
    name: Pre-release Lint
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }

      - name: Rust setup
        uses: ./.github/actions/rust-setup
        with: { components: "rustfmt, clippy" }

      - name: Verify version matches tag
        run: |
          CARGO_VERSION=$(cargo pkgid | cut -d# -f2)
          REF="${{ github.event.inputs.tag || github.ref }}"
          TAG_VERSION="${REF#refs/tags/}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [[ "$CARGO_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
      - run: bun i -g dprint tombi

      - name: Run lint checks
        run: just ci-lint

  build:
    name: Build ${{ matrix.platform.target }}
    needs: [lint, define-matrix]
    runs-on: ${{ matrix.platform.os }}
    permissions: { contents: read, id-token: write, attestations: write }
    env:
      BIN_NAME: bun-docs-mcp-proxy
      BIN_FILE: bun-docs-mcp-proxy${{ matrix.platform.bin_ext }}
      BIN_DIR: target/${{ matrix.platform.target }}/release
      ARCHIVE_NAME: bun-docs-mcp-proxy-${{ matrix.platform.name }}.${{ matrix.platform.archive_ext }}
      ARCHIVE_PATH: target/${{ matrix.platform.target }}/release/bun-docs-mcp-proxy-${{ matrix.platform.name }}.${{matrix.platform.archive_ext }}
      TARGET: ${{ matrix.platform.target }}
      CROSS: ${{ matrix.platform.cross }}
      ARCHIVE_EXT: ${{ matrix.platform.archive_ext }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.define-matrix.outputs.platforms) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }

      - name: Rust setup
        uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.platform.target }}
          cache-key: ${{ matrix.platform.target }}
          install-just: "false"

      - name: Install Zig
        if: matrix.platform.cross
        uses: goto-bus-stop/setup-zig@v2.2.1

      - name: Install cargo-zigbuild
        if: matrix.platform.cross
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build
        run: |
          set -euo pipefail
          if [[ "${CROSS}" == "true" ]]; then
            cargo zigbuild --release --target "${TARGET}"
          else
            cargo build --release --target "${TARGET}"
          fi

      - name: Package
        working-directory: ${{ env.BIN_DIR }}
        run: |
          if [[ "${ARCHIVE_EXT}" == "zip" ]]; then
            7z a "${ARCHIVE_NAME}" "${BIN_FILE}"
          else
            tar czf "${ARCHIVE_NAME}" "${BIN_FILE}"
          fi

      - name: Generate attestation
        uses: actions/attest-build-provenance@v3
        with: { subject-path: "${{ env.ARCHIVE_PATH }}" }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with: { name: "bun-docs-mcp-proxy-${{ matrix.platform.name }}", path: "${{ env.ARCHIVE_PATH }}", retention-days: 1 }

  release:
    name: Create Release
    needs: [build, define-matrix]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    permissions: { contents: write }
    env: { REF: "${{ github.event.inputs.tag || github.ref }}" }
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with: { ref: "${{ env.REF }}" }

      - name: Create Release
        uses: ./.github/actions/create-release
        with:
          tag: "${{ env.REF }}"
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          matrix_json: ${{ needs.define-matrix.outputs.platforms }}
