# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: CI

on:
  push:
    branches: [master]
    paths:
      - "**/*.rs"
      - "Cargo.*"
      - "**/*.toml"
      - "justfile"
      - ".github/actions/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "**/*.rs"
      - "Cargo.*"
      - "**/*.toml"
      - "justfile"
      - ".github/actions/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions: { contents: read }

# This CI workflow runs fast, network-free unit tests by default.
# Integration tests that require real API calls to bun.com are disabled
# for faster CI runs and better reliability.
#
# To run integration tests:
# - Locally: cargo test --features integration-tests
# - CI: See .github/workflows/integration-tests.yml (scheduled daily + manual)

jobs:
  coverage:
    name: Code Coverage
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: $/.github/actions/rust-setup
        with: { install-nextest: "true", install-llvm-cov: "true" }

      - run: just ci-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with: { files: codecov.json, fail_ci_if_error: true }

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with: { report_type: test_results, files: target/nextest/ci/junit.xml }

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/rust-setup
        with: { components: "rustfmt, clippy" }
      - run: rustup toolchain install nightly --component rustfmt
      - uses: oven-sh/setup-bun@v2
      - run: bun i -g dprint tombi
      - uses: taiki-e/install-action@cargo-deny
      - run: just ci-lint

  build-matrix:
    name: Build ${{ matrix.platform.target }}
    needs: coverage
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust setup
        uses: $/.github/actions/rust-setup
        with:
          targets: ${{ matrix.platform.target }}
          cache-key: ${{ matrix.platform.target }}
          install-just: "false"

      - name: Build
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: "bun-docs-mcp-proxy-${{ matrix.platform.target }}"
          path: "target/${{ matrix.platform.target }}/release/bun-docs-mcp-proxy${{ runner.os == 'Windows' && '.exe' || '' }}"
          retention-days: 1
